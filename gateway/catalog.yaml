name: mrdtech-mcp-ro
displayName: MRDTech MCP Read-Only Gateway
registry:
  portainer-readonly:
    description: MRDTech minimal Portainer read-only MCP server. GET-only endpoint
      allowlist 2 and 3.
    title: MRDTech Portainer Read-Only
    type: server
    image: mrdtech/portainer-readonly-mcp:phase1
    tools:
    - name: list_stacks
    - name: get_stack_status
  github-readonly:
    description: Official GitHub MCP server with GITHUB_READ_ONLY=1 and read-only
      context/repos/issues/pull_requests/actions toolsets.
    title: GitHub Read-Only
    type: server
    image: ghcr.io/github/github-mcp-server:latest
  filesystem-readonly:
    description: Official Filesystem MCP server mounted read-only to /data/compose
      only. Gateway hard-allowlisted read tools.
    title: Filesystem Read-Only
    type: server
    image: mrdtech/filesystem-readonly-mcp:phase1
    tools:
    - name: read_text_file
    - name: read_media_file
    - name: read_multiple_files
    - name: list_directory
    - name: list_directory_with_sizes
    - name: directory_tree
    - name: search_files
    - name: get_file_info
    - name: list_allowed_directories
  proxmox-readonly:
    description: GethosTheWalrus/proxmox-mcp with PVEAuditor token and gateway hard
      allowlist; proxmox_api_raw excluded.
    title: Proxmox Read-Only
    type: server
    image: mcp/proxmox:latest
    tools:
    - name: list_vms
    - name: get_vm_status
    - name: get_vm_config
    - name: get_vm_pending
    - name: get_vm_feature
    - name: get_vm_rrddata
    - name: list_vm_snapshots
